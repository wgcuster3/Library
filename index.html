<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="javascript.js" defer></script>

    <style>
        body {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-size: 1.5rem;
        }

        table {
            margin: 5px 0 10px 0;
        }

        th, td {
            padding: 5px 20px;
        }

        button {
            font-size: 1.25rem;
            padding: 3px 10px;
        }
    </style>
</head>
<body>
    <H1>My Library</H1>
        
    <table id="bookTable">
      <thead>
        <tr>  
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Pages</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="bookTableBody">

      </tbody>
    </table>
        
    <button command="show-modal" commandfor="my-dialog">Add Book</button>

    <dialog id="my-dialog">
      <label for="title">Title</label>
      <input type="text" id="title" value="title">
      </br>
      <label for="author">Author</label>
      <input type="text" id="author" value="author">
      </br>
      <label for="pages">Pages</label>
      <input type="number" id="pages" value="123">
      </br>
      <label for="status">Status</label>
      <input type="text" id="status" pattern="/^[yn]$/i" maxlength="1" value="Y">
      </br>
      <button id="submitBtn">Submit</button>
      </br>
      <button commandfor="my-dialog" command="close">Close</button>
    </dialog>
</body>
</html>
